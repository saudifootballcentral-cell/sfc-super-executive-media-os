# Railway configuration — SFC Super Executive Media OS
# https://docs.railway.com/reference/config-as-code
#
# builder = "DOCKERFILE" (uppercase) is required — lowercase is not recognised
# and causes Railway to fall back to Railpack/Nixpacks auto-detection.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python scripts/railway_worker.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
