[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfc-media-os"
version = "1.0.0"
description = "SFC Super Executive Media OS — Autonomous AI-native Saudi football media company"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0,<0.3.0",
    "langchain-core>=0.2.0,<0.3.0",
    "anthropic>=0.40.0,<1.0.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.0,<25.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
